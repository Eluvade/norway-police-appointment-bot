<!-- Render ```mermaid blocks on the GitHub Pages site, as github.com does -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
    const box = document.createElement("div");
    box.className = "mermaid";
    box.textContent = el.textContent;
    (el.tagName === "CODE" ? el.parentElement : el).replaceWith(box);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
