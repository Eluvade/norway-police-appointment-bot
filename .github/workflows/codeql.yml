name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Only scans the original project, not people's copies of it
    if: github.repository == 'Eluvade/norway-police-appointment-bot'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
